  <noscript><img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=2506070169900710&ev=PageView&noscript=1" alt="" /></noscript>
  <header class="topbar"><a class="brand" href="#top">線上額度<span>評估</span></a><a class="top-cta" href="#funding">立即諮詢</a></header>
  <main id="top" class="landing-page">
    <section class="hero">
      <img src="assets/hero.jpg" alt="為資金周轉與卡費壓力煩惱的上班族" />
      <div class="hero-shade"></div>
      <div class="hero-copy"><p class="eyebrow">資金需求，先釐清再行動</p><h1>讓專人協助您<br><em>擬訂解決方案</em></h1><p>線上簡單填寫資料，即可送出評估。</p><a class="arrow-reveal-button" href="#funding"><span class="arrow-reveal-button__label">想借多少 自己先選</span><span class="arrow-reveal-button__badge" aria-hidden="true"></span><svg class="arrow-reveal-button__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12H19M19 12L13 6M19 12L13 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg></a></div>
    </section>
    <section id="funding" class="funding-section"><div class="funding-wrap"><p class="kicker">選擇額度</p><h2>選擇您的<br>資金需求額度</h2><div class="funding-options" role="group" aria-label="資金需求額度"><button type="button" data-amount="10萬-30萬">10萬-30萬</button><button type="button" data-amount="30萬-80萬">30萬-80萬</button><button type="button" data-amount="80萬-180萬">80萬-180萬</button><button type="button" data-amount="180萬-300萬">180萬-300萬</button></div><button id="continue-button" class="button submit" type="button" disabled>確認並繼續 <span>→</span></button></div></section>
  </main>
  <main id="application-page" class="application-page" hidden><section class="form-section"><img src="assets/closing.jpg" alt="專人資金諮詢服務示意圖" /><div class="form-wrap"><button id="back-button" class="back-button" type="button">← 返回額度選擇</button><p class="kicker">聯絡我們</p><h2>填寫<br><em>申請資料</em></h2><p>您選擇的額度：<strong id="selected-amount">未選擇</strong></p><form id="lead-form"><input id="amount-field" name="amount" type="hidden" /><label>您的稱呼<input name="name" autocomplete="name" required placeholder="請輸入稱呼" /></label><label>年齡<input name="age" type="number" inputmode="numeric" min="18" max="120" required placeholder="請輸入年齡" /></label><label>聯絡電話<input name="phone" inputmode="tel" autocomplete="tel" required placeholder="請輸入手機號碼" /></label><label>是否警示戶<select name="warning-account" required><option value="">請選擇</option><option value="yes">是</option><option value="no">否</option></select></label><label class="consent"><input type="checkbox" required /> <span>我已閱讀並同意提供資料，以供專人進行本次諮詢聯繫。</span></label><button class="button submit" type="submit">送出申請→加入 LINE 聯絡</button><p class="form-message" role="status"></p></form></div></section></main>
  <footer class="note"><h2>重要提醒</h2><p>本頁針對資金需求登記，不代表核准、利率或分配承諾；實際結果視個別條件確認。</p></footer>
  <div id="success-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="success-title" hidden><div class="modal-card"><p class="modal-kicker">最後一步</p><h2 id="success-title">加入 LINE，傳送諮詢編號</h2><p class="modal-warning">未傳送編號，專員無法核對您的申請資料</p><div class="consultation-code"><span>您的諮詢編號</span><strong id="consultation-code">—</strong></div><a id="line-cta" class="button line-cta" href="https://lin.ee/OKRaTKK"><svg class="line-icon" viewBox="0 0 48 48" aria-hidden="true"><path fill="currentColor" d="M6 7.5h36v24.2c0 4.2-3.4 7.6-7.6 7.6H22.8l-9.4 6.1 1.9-6.1H13.6A7.6 7.6 0 0 1 6 31.7V7.5Z"/><text x="24" y="27" text-anchor="middle">LINE</text></svg>複製編號並前往 LINE <span>→</span></a><p class="modal-hint">加入好友後，請直接貼上並傳送此編號，專員才能優先處理</p></div></div>
